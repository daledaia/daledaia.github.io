<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dale Daia · Achados Casa e Decoração</title>
<meta name="description" content="Casa linda sem gastar uma fortuna. Achados da Shopee e do Mercado Livre, cupons e grupo VIP de promoções.">
<meta property="og:title" content="Dale Daia · Achados Casa e Decoração">
<meta property="og:description" content="Casa linda sem gastar uma fortuna. Links, cupons e grupo VIP de promoções.">
<meta property="og:image" content="logo.png">
<meta name="theme-color" content="#FBF7F2">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Montserrat:wght@400;500;600&display=swap">
<style>
/* Página de links Dale Daia — uma coluna, logo no topo, botões empilhados */
:root{
  --creme:#FBF7F2; --areia:#D9C4B0; --cacau:#6B4F3F; --vinho:#7A1F2B; --dourado:#C9A46A; --tinta:#3B2A22; --branco:#FFFFFF;
  --serif:"Cormorant Garamond",Georgia,serif; --sans:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--creme);color:var(--tinta)}
body{font-family:var(--sans);min-height:100vh;
  padding:max(28px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.wrap{max-width:440px;margin:0 auto;display:grid;gap:14px;text-align:center}
.logo{width:132px;height:132px;border-radius:50%;margin:0 auto;display:block;box-shadow:0 0 0 1px var(--areia)}
h1{font-family:var(--serif);font-style:italic;font-weight:600;font-size:34px;margin:6px 0 0;line-height:1}
.tag{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--cacau);margin:0}
.lead{font-family:var(--serif);font-style:italic;font-size:21px;color:var(--cacau);margin:4px 0 8px}
.line{width:56px;height:2px;background:var(--dourado);margin:0 auto 6px;border:0}
a.btn{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--tinta);background:var(--branco);
  border:1px solid var(--areia);border-radius:16px;padding:14px 16px;text-align:left;transition:transform .15s,border-color .15s}
a.btn:hover,a.btn:focus-visible{border-color:var(--dourado);transform:translateY(-1px);outline:none}
a.btn .ic{width:42px;height:42px;border-radius:50%;background:var(--creme);border:1px solid var(--areia);display:grid;place-items:center;flex-shrink:0;color:var(--cacau)}
a.btn .ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
a.btn b{display:block;font-weight:600;font-size:15px}
a.btn small{display:block;font-size:12px;color:var(--cacau);margin-top:2px}
a.btn .ar{margin-left:auto;color:var(--dourado);font-size:20px}
a.btn.vip{background:var(--vinho);border-color:var(--vinho);color:var(--creme)}
a.btn.vip small{color:#E7C99A}
a.btn.vip .ic{background:rgba(255,255,255,.1);border-color:rgba(231,201,154,.6);color:#E7C99A}
.soc{display:flex;justify-content:center;gap:12px;margin-top:6px}
.soc a{width:44px;height:44px;border-radius:50%;border:1px solid var(--areia);display:grid;place-items:center;color:var(--cacau);background:var(--branco)}
.soc svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sec{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--tinta);margin:14px 0 0}
a.prod{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--tinta);background:var(--branco);border:1px solid var(--areia);border-radius:16px;padding:10px;text-align:left}
a.prod img,a.prod .ph{width:64px;height:64px;border-radius:12px;object-fit:cover;flex-shrink:0;background:var(--creme)}
a.prod b{display:block;font-weight:600;font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
a.prod small{display:block;font-size:12px;color:var(--vinho);margin-top:4px;font-weight:600}
.foot{font-size:11px;color:var(--cacau);margin-top:10px;line-height:1.6}
@media (prefers-reduced-motion:reduce){a.btn{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <img class="logo" src="logo.png" alt="Logo Dale Daia" width="132" height="132">
  <h1>Dale Daia</h1>
  <p class="tag">Achados · Casa · Decoração</p>
  <p class="lead">Casa linda sem gastar uma fortuna</p>
  <hr class="line">
  <div id="links" style="display:grid;gap:12px"></div>
  <div id="dia" style="display:grid;gap:10px"></div>
  <div class="soc" id="soc"></div>
</main>
<script>
// ====== EDITE SÓ AQUI: cole os seus links entre as aspas. Link vazio = botão escondido. ======
const LINKS = [
  {destaque:true, icone:"coroa",   titulo:"Grupo VIP de promoções", texto:"Ofertas reais todo dia no WhatsApp", url:"https://chat.whatsapp.com/E6jfFnVCMfN9Byt4p1nEtm"},
  {icone:"arvore",  titulo:"Achadinhos de Natal",          texto:"Decoração para deixar a casa no clima", url:"https://s.shopee.com.br/4B0pFc8wN9"},
  {icone:"cupom",   titulo:"Cupons da Shopee",             texto:"Pegue antes de comprar e pague menos", url:"https://s.shopee.com.br/50ZwF95lgK"}
];
// Achadinhos do dia: o robô do Google escolhe produtos novos todo dia às 6h (não precisa mexer aqui).
const ROBO = "https://script.google.com/macros/s/AKfycbzdJLT5-Lwb9oKNOAcwa4nZzZ95bw21W3QWOenf8ORFQmjH2QeHviIrVaPvmxLBDsKI/exec";
const REDES = { tiktok:"https://www.tiktok.com/@daiana.lima95", instagram:"https://www.instagram.com/daledaia/" };
// ==========================================================================================
const ICON = {
  coroa:'<path d="M3 8l4 4 5-7 5 7 4-4-2 11H5L3 8z"/>',
  sacola:'<path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  arvore:'<path d="M12 3l5 7h-3l4 6h-4l3 4H7l3-4H6l4-6H7l5-7z"/>',
  cupom:'<path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4V7z"/><path d="M10 9v6"/>',
  caixa:'<path d="M3 8l9-5 9 5v8l-9 5-9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  loja:'<path d="M4 9l1.5-5h13L20 9"/><path d="M4 9a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0 2.7 2.7 0 0 0 5.3 0"/><path d="M5 11v9h14v-9"/><path d="M10 20v-5h4v5"/>',
  flor:'<circle cx="12" cy="10" r="2.5"/><path d="M12 7.5a2.5 2.5 0 1 1 2.4 3.2M14.4 10.7a2.5 2.5 0 1 1-1.2 3.8M10.8 14.5a2.5 2.5 0 1 1-1.2-3.8M9.6 10.7A2.5 2.5 0 1 1 12 7.5"/><path d="M12 12.5V21M12 17c-2 0-3-1-3.5-2.5"/>',
  tiktok:'<path d="M14 4v10a4 4 0 1 1-4-4"/><path d="M14 4c0 3 2 5 5 5"/>',
  instagram:'<rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.5"/><circle cx="17" cy="7" r=".6"/>'
};
const svg = k => '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICON[k]||'') + '</svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
document.getElementById("links").innerHTML = LINKS.filter(l => l.url).map(l =>
  '<a class="btn' + (l.destaque ? ' vip' : '') + '" href="' + esc(l.url) + '" target="_blank" rel="noopener">' +
  '<span class="ic">' + svg(l.icone) + '</span><span><b>' + esc(l.titulo) + '</b><small>' + esc(l.texto) + '</small></span><span class="ar" aria-hidden="true">›</span></a>').join("");
fetch(ROBO).then(r => r.json()).then(j => {
  const vs = (j.videos || []).filter(v => v.link && v.nome).slice(-3);
  if (!vs.length) return;
  document.getElementById("dia").innerHTML = '<p class="sec">Achadinhos do dia</p>' + vs.map(v =>
    '<a class="prod" href="' + esc(v.link) + '" target="_blank" rel="noopener">' + (v.foto ? '<img src="' + esc(v.foto) + '" alt="" loading="lazy">' : '<span class="ph"></span>') +
    '<span><b>' + esc(v.nome) + '</b><small>' + esc(v.preco) + ' · ver na Shopee</small></span></a>').join("");
}).catch(() => {});
document.getElementById("soc").innerHTML = Object.entries(REDES).filter(([,u]) => u).map(([k,u]) =>
  '<a href="' + esc(u) + '" target="_blank" rel="noopener" aria-label="' + k + '">' + svg(k) + '</a>').join("");
</script>
</body>
</html>
